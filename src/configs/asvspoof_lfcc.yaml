model:
  _target_: src.model.lcnn.LCNN
  dropout: 0.75
  num_classes: 2

writer:
  _target_: src.logger.WandBWriter
  project_name: "asvspoof2019_lcnn"
  entity: null
  run_name: "lcnn_lfcc_final"
  mode: "online"
  loss_names: ["loss"]
  log_checkpoints: false
  id_length: 8

metrics:
  train:
    - _target_: src.metrics.eer.AccuracyMetric
      name: "Accuracy"

  inference:
    - _target_: src.metrics.eer.AccuracyMetric
      name: "Accuracy"

    - _target_: src.metrics.eer.EERMetric
      name: "EER"

transforms:
  instance_transforms:
    train:
      audio:
        _target_: src.transforms.LFCC
        sample_rate: 16000
        n_filter: 20
        n_lfcc: 20
        n_fft: 512
        win_length: 320
        hop_length: 160

    inference:
      audio:
        _target_: src.transforms.LFCC
        sample_rate: 16000
        n_filter: 20
        n_lfcc: 20
        n_fft: 512
        win_length: 320
        hop_length: 160

  batch_transforms:
    train: null
    inference: null

datasets:
  train:
    _target_: src.datasets.asvspoof_dataset.ASVspoofDataset
    root: ${oc.env:ASVSPOOF_ROOT}
    split: "train"
    sample_rate: 16000
    num_samples: 112000
    limit: null
    shuffle_index: false
    instance_transforms: ${transforms.instance_transforms.train}

  dev:
    _target_: src.datasets.asvspoof_dataset.ASVspoofDataset
    root: ${oc.env:ASVSPOOF_ROOT}
    split: "dev"
    sample_rate: 16000
    num_samples: 112000
    limit: null
    shuffle_index: false
    instance_transforms: ${transforms.instance_transforms.inference}

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 10
  gamma: 0.5

loss_function:
  _target_: src.loss.WeightedCrossEntropyLoss

trainer:
  log_step: 50
  n_epochs: 30
  epoch_len: null

  device_tensors:
    - "audio"
    - "labels"

  resume_from: null
  device: "auto"
  override: false
  monitor: "min dev_EER"
  save_period: 5
  early_stop: 30
  save_dir: "saved"
  seed: 1
  skip_oom: true